name: Deploy CRM API production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test tests/backend.Tests/backend.Tests.csproj -c Release
      - name: Publish API
        run: dotnet publish backend.csproj -c Release -r linux-x64 --self-contained true -o artifacts/backend
      - name: Package backend
        run: tar -czf backend.tar.gz -C artifacts/backend .
      - name: Prepare encrypted-in-transit runtime secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL__APPID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL__APIKEY }}
        run: |
          set -euo pipefail
          test ${#JWT_SECRET} -ge 32
          test -n "$ONESIGNAL_APP_ID"
          test -n "$ONESIGNAL_API_KEY"
          umask 077
          {
            printf 'JWT_SECRET_B64=%s\n' "$(printf '%s' "$JWT_SECRET" | base64 -w0)"
            printf 'ONESIGNAL_APP_ID_B64=%s\n' "$(printf '%s' "$ONESIGNAL_APP_ID" | base64 -w0)"
            printf 'ONESIGNAL_API_KEY_B64=%s\n' "$(printf '%s' "$ONESIGNAL_API_KEY" | base64 -w0)"
          } > runtime-secrets.b64
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and activate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          SSH_OPTIONS=(-o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          retry() {
            local attempt
            for attempt in 1 2 3 4; do
              "$@" && return 0
              if [ "$attempt" -eq 4 ]; then return 1; fi
              echo "Connection attempt $attempt failed; retrying in $((attempt * 15)) seconds..."
              sleep $((attempt * 15))
            done
          }
          retry ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p incoming/backend-$GITHUB_SHA"
          retry scp "${SSH_OPTIONS[@]}" backend.tar.gz runtime-secrets.b64 "$VPS_USER@$VPS_HOST:incoming/backend-$GITHUB_SHA/"
          retry ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/crm-deploy-backend $GITHUB_SHA"
